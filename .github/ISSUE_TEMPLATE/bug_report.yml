name: Bug report
description: Report a reproducible problem with the site or repository.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a problem.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the observed problem and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the URL, environment, and minimal steps.
      placeholder: |
        1. Visit ...
        2. Click ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Include screenshots, browser version, or logs when helpful.
