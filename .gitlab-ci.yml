image: node:22-bookworm

variables:
  PUPPETEER_CACHE_DIR: $CI_PROJECT_DIR/.cache/puppeteer

stages:
  - image_sync
  - quality

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

image_sync:
  stage: image_sync
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run images:upload

quality:
  stage: quality
  cache:
    - key:
        files:
          - package-lock.json
      paths:
        - .npm/
    - key: puppeteer-chrome
      paths:
        - .cache/puppeteer/
    - key: diagrams
      paths:
        - src/diagrams/.manifest.json
        - public/diagrams/
    - key: fonts
      paths:
        - public/fonts/
  before_script:
    - apt-get update
    - |
      apt-get install --yes --no-install-recommends \
        libasound2 \
        libxfixes3 \
        libxext6 \
        libxrender1 \
        libx11-xcb1 \
        libxkbcommon0 \
        libxi6 \
        fonts-liberation \
        libatk-bridge2.0-0 \
        libatk1.0-0 \
        libcups2 \
        libdrm2 \
        libgbm1 \
        libnss3 \
        libpango-1.0-0 \
        libxcomposite1 \
        libxdamage1 \
        libxrandr2
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run test:quality
    - npm run pdfs:upload
  artifacts:
    when: on_failure
    expire_in: 1 week
    paths:
      - dist/
      - public/llm.txt
      - public/diagrams/
