image: node:22-bookworm

stages:
  - image_sync
  - quality

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

image_sync:
  stage: image_sync
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run images:upload
  variables:
    AWS_ACCESS_KEY_ID: $R2_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY: $R2_SECRET_ACCESS_KEY

quality:
  stage: quality
  before_script:
    - apt-get update
    - |
      apt-get install --yes --no-install-recommends \
        libasound2 \
        libxfixes3 \
        libxext6 \
        libxrender1 \
        libx11-xcb1 \
        libxkbcommon0 \
        libxi6 \
        fonts-liberation \
        libatk-bridge2.0-0 \
        libatk1.0-0 \
        libcups2 \
        libdrm2 \
        libgbm1 \
        libnss3 \
        libpango-1.0-0 \
        libxcomposite1 \
        libxdamage1 \
        libxrandr2
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run test:quality
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - dist/
      - public/llm.txt
      - public/diagrams/
