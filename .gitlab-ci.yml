image: node:22-bookworm

stages:
  - quality

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

quality:
  stage: quality
  before_script:
    - apt-get update
    - |
      apt-get install --yes --no-install-recommends \
        libasound2 \
        libatk-bridge2.0-0 \
        libatk1.0-0 \
        libcups2 \
        libdrm2 \
        libgbm1 \
        libnss3 \
        libpango-1.0-0 \
        libxcomposite1 \
        libxdamage1 \
        libxrandr2
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run test:quality
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - dist/
      - public/llm.txt
      - public/diagrams/
