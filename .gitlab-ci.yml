image: node:22-bookworm

variables:
  PUPPETEER_CACHE_DIR: $CI_PROJECT_DIR/.cache/puppeteer

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never

stages:
  - validate
  - build
  - review
  - publish

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

.install:
  before_script:
    - apt-get update
    - |
      apt-get install --yes --no-install-recommends \
        libasound2 \
        libxfixes3 \
        libxext6 \
        libxrender1 \
        libx11-xcb1 \
        libxkbcommon0 \
        libxi6 \
        fonts-liberation \
        libatk-bridge2.0-0 \
        libatk1.0-0 \
        libcups2 \
        libdrm2 \
        libgbm1 \
        libnspr4 \
        libnss3 \
        libpango-1.0-0 \
        libxcomposite1 \
        libxdamage1 \
        libxrandr2
    - npm ci --cache .npm --prefer-offline

check:
  extends: .install
  stage: validate
  script:
    - npm run assets:manifest
    - npm run check
    - npm run test:unit

build:
  extends: .install
  stage: build
  needs: ["check"]
  script:
    - npm run build
    - node scripts/validate-build.mjs
    - node scripts/validate-links.mjs
    - node scripts/validate-images.mjs

quality:
  extends: .install
  stage: review
  needs: ["check", "build"]
  cache:
    - key:
        files:
          - package-lock.json
      paths:
        - .npm/
    - key: puppeteer-chrome
      paths:
        - .cache/puppeteer/
    - key: diagrams
      paths:
        - src/diagrams/.manifest.json
        - public/diagrams/
    - key: fonts
      paths:
        - public/fonts/
  script:
    - npm run test:quality
  artifacts:
    when: on_failure
    expire_in: 1 week
    paths:
      - dist/
      - public/llm.txt
      - public/diagrams/

image_sync:
  extends: .install
  stage: publish
  needs: ["quality"]
  variables:
    AWS_ACCESS_KEY_ID: $R2_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY: $R2_SECRET_ACCESS_KEY
  script:
    - npm run images:upload
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

pdf_sync:
  extends: .install
  stage: publish
  needs: ["quality"]
  variables:
    AWS_ACCESS_KEY_ID: $R2_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY: $R2_SECRET_ACCESS_KEY
  script:
    - npm run build
    - npm run pdfs:upload
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

mirror_to_github:
  stage: publish
  needs: ["image_sync", "pdf_sync"]
  before_script:
    - git config user.name "GitLab publisher"
    - git config user.email "gitlab-publisher@kieferwaight.com"
  script:
    - test -n "$GITHUB_MIRROR_TOKEN" || { echo "GITHUB_MIRROR_TOKEN is required on protected main to publish."; exit 1; }
    - git push "https://x-access-token:${GITHUB_MIRROR_TOKEN}@github.com/kieferwaight/kieferwaight.com.git" "HEAD:main"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
